name: Scaffold and install

# Proves that what `pgpm init` produces from this branch installs against the
# real registry, today. `pnpm install` runs with the template's own supply-chain
# policy and no overrides, so a first-party package the policy fails to exempt
# (a new unscoped name missing from the pinned inventory and from `packages:`
# in pnpm-policy.yaml) fails here instead of on the next user's machine.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Daily: a constructive release can break a fresh scaffold with no change here.
    - cron: '17 8 * * *'
  workflow_dispatch:

jobs:
  scaffold:
    name: supabase workspace + module
    runs-on: ubuntu-latest

    # The scaffolded module's tests run against the local Supabase stack.
    env:
      PGHOST: 127.0.0.1
      PGPORT: 54322
      PGUSER: supabase_admin
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase stack
        run: |
          mkdir -p "$RUNNER_TEMP/sbstack"
          cd "$RUNNER_TEMP/sbstack"
          supabase init
          supabase start

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pgpm CLI
        run: npm install -g pgpm@latest

      - name: Scaffold workspace from this checkout
        run: |
          mkdir -p "$RUNNER_TEMP/scaffold"
          cd "$RUNNER_TEMP/scaffold"
          pgpm init workspace --repo "$GITHUB_WORKSPACE" \
            --name demo --repoName demo --fullName "CI Test User" --email ci@example.com \
            --username ci --license MIT --no-interactive

      - name: Scaffold module inside it
        working-directory: ${{ runner.temp }}/scaffold/demo
        run: |
          pgpm init --repo "$GITHUB_WORKSPACE" \
            --name demo-module --moduleName demo-module --moduleDesc "CI module" \
            --repoName demo --fullName "CI Test User" --email ci@example.com \
            --username ci --access public --license MIT --no-interactive

      - name: Install @pgpm/supabase into the module
        working-directory: ${{ runner.temp }}/scaffold/demo/packages/demo-module
        run: pgpm install @pgpm/supabase

      # No --config.minimum-release-age override: this is the install a new user runs.
      - name: pnpm install
        working-directory: ${{ runner.temp }}/scaffold/demo
        run: pnpm install

      - name: Check supply-chain policy
        working-directory: ${{ runner.temp }}/scaffold/demo
        run: pnpm run policy:check

      - name: Build
        working-directory: ${{ runner.temp }}/scaffold/demo
        run: pnpm build

      - name: Test
        working-directory: ${{ runner.temp }}/scaffold/demo
        run: pnpm test

      # The workspace's own gate: every module deployed into an ephemeral
      # database on the Supabase stack and graded with safegres:supabase.
      - name: Database audit
        working-directory: ${{ runner.temp }}/scaffold/demo
        run: pnpm run audit:db
